<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Iris</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body data-eye="closed">
    <main class="panel">
      <div class="ask">
        <svg class="eye" viewBox="0 0 32 32" aria-hidden="true">
          <g class="eye-closed">
            <path d="M 5 13.5 Q 16 26 27 13.5" />
          </g>
          <g class="eye-open">
            <path d="M 5 16 Q 16 3 27 16 Q 16 29 5 16 Z" />
            <circle cx="16" cy="16" r="3.2" />
          </g>
        </svg>
        <input
          id="question"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Ask about the app in front of you"
        />
      </div>

      <section class="response" id="response" aria-live="polite">
        <p class="placeholder">Iris cannot read anything yet.</p>
      </section>

      <footer class="hint">
        <kbd>esc</kbd><span>close</span>
        <span class="spacer"></span>
        <kbd>⌘</kbd><kbd>⇧</kbd><kbd>space</kbd><span>toggle</span>
      </footer>
    </main>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
